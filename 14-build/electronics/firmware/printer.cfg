# =====================================================================================
#  SP1 v3 drive box — Klipper configuration for BTT Manta M8P V2.0 + CB1
#  Project SCRATCH · 14-build/electronics · 2026-10-02
#
#  Copy to /home/biqu/printer_data/config/printer.cfg on the CB1, then FIRMWARE_RESTART.
#  Pin names: BTT generic-bigtreetech-manta-m8p-V2_0.cfg + M8P V2.0 pinout (both cited in
#  electronics.md §11).  Every pin used here is listed in electronics.md §4 (wiring table).
#
#  SAFETY: nothing in this file is a safety barrier.  Every load below has its + side on
#  ACT-12 / ACT-24, which exists only while the hardware loop (e-stop, hold-to-run K1,
#  latch, helmet loop, watchdog) is closed.  The shutdown values below only make a Klipper
#  shutdown agree with the hardware (everything off = vented = lifted).
#
#  Units: the drums are G-code axes A, B, C in mm of CABLE (l > 0 = paid out).
#  "temperature" of every sensor/heater below is kPa (pressure) or % (knobs).
# =====================================================================================

[mcu]
#  ls /dev/serial/by-id/   ->  paste the usb-Klipper_stm32h723xx_... line here
serial: /dev/serial/by-id/usb-Klipper_stm32h723xx_REPLACE_ME-if00
restart_method: command

[printer]
#  "none" kinematics: no XYZ.  max_velocity / max_accel must exist but are not used
#  (Klipper Config_Reference, "None Kinematics").
kinematics: none
max_velocity: 1
max_accel: 1

[respond]

# -------------------------------------------------------------------------------------
#  THE THREE DRUMS — manual steppers registered as G-code axes A, B, C at run time
#  (MANUAL_STEPPER ... GCODE_AXIS=A).  TMC2209 in STANDALONE step/dir mode: no
#  [tmc2209] sections, current set by the VREF trimmer (hardware cap), 1/16 microsteps
#  set by the MS1+MS2 jumpers.  rotation_distance = pi x 12 mm drum = 37.699 mm.
#
#  accel: 0 is REQUIRED.  With kinematics none every G1 A/B/C move is an "extra-axis
#  only" move: Klipper does not blend junctions for such moves, and a non-zero accel here
#  would ramp every 1 mm segment to zero.  The host plans the velocity profile itself and
#  registers each axis with LIMIT_ACCEL=100000000 so segments run at constant speed, and
#  LIMIT_VELOCITY=250 (mm/s of cable) as a firmware speed guard
#  (see electronics.md §8.2 and klippy/toolhead.py Move.__init__ / calc_junction).
# -------------------------------------------------------------------------------------
[manual_stepper cable_a]
#  Motor1 socket (driver jumper HV/VM/VBB set to HV = Motor Power input = ACT-24)
step_pin: PE6
dir_pin: PE5
enable_pin: !PC14
microsteps: 16
rotation_distance: 37.699
velocity: 5
accel: 0
#  drum index Hall (A3144, open collector, low when the magnet faces it) on M1-STOP
endstop_pin: ^!PF4
position_min: -25
position_max: 25

[manual_stepper cable_b]
#  Motor2 socket
step_pin: PE2
dir_pin: PE1
enable_pin: !PE4
microsteps: 16
rotation_distance: 37.699
velocity: 5
accel: 0
endstop_pin: ^!PF3
position_min: -25
position_max: 25

[manual_stepper cable_c]
#  Motor3 socket (BTT's sample inverts Z dir here; we do not - fix direction at bring-up)
step_pin: PB8
dir_pin: PB7
enable_pin: !PE0
microsteps: 16
rotation_distance: 37.699
velocity: 5
accel: 0
endstop_pin: ^!PF2
position_min: -25
position_max: 25

[idle_timeout]
#  Default would disable the drums after 10 min; the scorer re-homes after any
#  power-down anyway, but do not let Klipper surprise it during a long READY.
timeout: 3600
gcode:
  SP1_ALL_OFF
  M84

# -------------------------------------------------------------------------------------
#  VALVES (12 V coils, + on ACT-12, - on the M8P low-side MOSFET).  pwm_tool, not
#  output_pin: SET_PIN on a pwm_tool is synchronised to the motion queue with no
#  100 ms minimum spacing, and maximum_mcu_duration makes the MCU itself shut down
#  (all pins -> shutdown_value) if the host stops refreshing it (klippy hang).
#  Klipper requires value == shutdown_value when maximum_mcu_duration is set.
# -------------------------------------------------------------------------------------
[pwm_tool pin_a]
#  HE0 - S070C-6DC-32 PIN A (NC to rail: off = line vented)
pin: PA0
cycle_time: 0.040
value: 0
shutdown_value: 0
maximum_mcu_duration: 2.0

[pwm_tool pin_b]
#  HE1 - S070 PIN B, 25 Hz PWM force servo (with the Ø0.3 inlet needle)
pin: PA1
cycle_time: 0.040
value: 0
shutdown_value: 0
maximum_mcu_duration: 2.0

[pwm_tool palm]
#  HE2 - PALM 3-way (off = float vented -> spring retracts the pad)
pin: PA3
cycle_time: 0.040
value: 0
shutdown_value: 0
maximum_mcu_duration: 2.0

[pwm_tool rail_dump]
#  FAN0 - RAIL DUMP, normally OPEN valve: 1 = energised = closed; 0 = rail vents
pin: PF7
cycle_time: 0.040
value: 0
shutdown_value: 0
maximum_mcu_duration: 2.0

[pwm_tool palm_dump]
#  FAN1 - PALM DUMP, normally OPEN
pin: PF9
cycle_time: 0.040
value: 0
shutdown_value: 0
maximum_mcu_duration: 2.0

[pwm_tool watchdog]
#  FAN2 - 1 kHz square wave into the charge pump that gates Q_WD (rail-enable MOSFET in
#  the K1 coil chain).  Hardware PWM: PF6 = TIM16_CH1 in Klipper's stm32h7 table.
#  If klippy stops refreshing for 1 s, the MCU shuts down and this pin goes low; if the
#  MCU hangs, the STM32 IWDG resets it (~0.5 s) and the pin floats low (10 k pull-down
#  on the safety board).  Either way the pump decays and K1 drops in <= 50 ms.
pin: PF6
hardware_pwm: True
cycle_time: 0.001
value: 0
shutdown_value: 0
maximum_mcu_duration: 1.0

[output_pin m8p_ok]
#  Servo header signal pin PE9 -> safety board "M8P_OK" (high = host agrees the latch may
#  stay clear).  Low (boot, shutdown, scorer FAULT) sets the REFLEX latch.
pin: PE9
value: 0
shutdown_value: 0

[output_pin chime]
#  SPI header PC12 -> 1 k -> 2N7000 gate; 5 V active buzzer from the safety-board 5 V
#  (logic domain, so the chime also sounds while the rail is off)
pin: PC12
value: 0
shutdown_value: 0

#  Reserved for pad 2 (SPEC §9), not wired now:
#    FAN4 (PA4)  = PALM B valve  (low side, + on ACT-12, VFAN4 jumper on VIN)
#    HB   (PF5)  = PALM B dump   (feed BED-Power IN from ACT-12 at pad-2 install, so the HB
#                                 flyback diode returns to a switched rail)
#    ADS1115 on the Pico's I2C (GP4/GP5) for S_palm B.
#  FAN5 / FAN6 are 4-pin fan headers (logic PWM + tach), not used.

[neopixel status]
#  RGB header PD15, 12-LED ring, 5 V from the header
pin: PD15
chain_count: 12
color_order: GRB
initial_RED: 0.0
initial_GREEN: 0.0
initial_BLUE: 0.2

# -------------------------------------------------------------------------------------
#  PRESSURE SENSORS: XGZP6847A 0-40 kPa gauge, 3.3 V version (0.2-2.7 V out), on the
#  thermistor inputs (4.7 k pull-up to 3.3 V stays fitted; the sensor output drives
#  it easily).  Calibrate each channel end-to-end at A1 against the water manometer and
#  edit the two points of its own table if it is off by > 0.3 kPa.
# -------------------------------------------------------------------------------------
[adc_temperature xgzp_40k_33]
temperature1: -3.2
voltage1: 0.0
temperature2: 0.0
voltage2: 0.2
temperature3: 40.0
voltage3: 2.7
temperature4: 48.0
voltage4: 3.2

[adc_temperature sp1_knob]
temperature1: 0
voltage1: 0.0
temperature2: 100
voltage2: 3.3

#  P1 rail pump as a "heater": PID on S_rail.  max_temp 28 kPa is an MCU-side range
#  check: above it (both reliefs failed, or the sensor unplugged -> reads 48) Klipper
#  shuts down and every output goes to its shutdown value.  PID gains are [EST]; tune
#  at A1 (electronics.md §9.6).  Klipper scales pid_K* by 1/255.
[heater_generic rail]
gcode_id: R
heater_pin: PA5
max_power: 0.8
pwm_cycle_time: 0.010
sensor_type: xgzp_40k_33
sensor_pin: PB0
adc_voltage: 3.3
smooth_time: 0.3
control: pid
pid_Kp: 75
pid_Ki: 35
pid_Kd: 0
min_temp: -20
max_temp: 28

[verify_heater rail]
max_error: 600
check_gain_time: 60
hysteresis: 3
heating_gain: 1

#  P3 palm pump on FAN3 (<= 1 A output; the palm pump must draw <= 0.8 A)
[heater_generic palm]
gcode_id: P
heater_pin: PF8
max_power: 0.8
pwm_cycle_time: 0.010
sensor_type: xgzp_40k_33
sensor_pin: PA7
adc_voltage: 3.3
smooth_time: 0.3
control: pid
pid_Kp: 75
pid_Ki: 35
pid_Kd: 0
min_temp: -20
max_temp: 28

[verify_heater palm]
max_error: 600
check_gain_time: 60
hysteresis: 3
heating_gain: 1

[temperature_sensor line_a]
#  TH1 - S_A, downstream of PIN A (stuck-valve detection)
sensor_type: xgzp_40k_33
sensor_pin: PC5
adc_voltage: 3.3
min_temp: -20
max_temp: 60

[temperature_sensor line_b]
#  TH2 - S_B, downstream of PIN B (B-ratio servo feedback)
sensor_type: xgzp_40k_33
sensor_pin: PC4
adc_voltage: 3.3
min_temp: -20
max_temp: 60

[temperature_sensor speed_knob]
#  FWS header PC0 - SPEED pot wiper (pot across 3.3 V / GND), reads 0-100 %
sensor_type: sp1_knob
sensor_pin: PC0
adc_voltage: 3.3
min_temp: -20
max_temp: 120

[temperature_sensor intensity_knob]
#  FWS header PF10 - INTENSITY pot wiper
sensor_type: sp1_knob
sensor_pin: PF10
adc_voltage: 3.3
min_temp: -20
max_temp: 120

# -------------------------------------------------------------------------------------
#  INPUTS.  Every 24 V node is read through a PC817 opto (transistor pulls the pin low
#  when 24 V is present), so "^!" = MCU pull-up, inverted: PRESSED = 24 V present.
#  These are READ-ONLY views of the hardware loop.
# -------------------------------------------------------------------------------------
[gcode_macro _SP1_NOP]
gcode:
  # intentionally empty: the scorer reads button states over the API

[gcode_button rail_sense]
#  M4-STOP PF1 <- opto on ACT-24 (after K1)
pin: ^!PF1
press_gcode: _SP1_NOP
release_gcode: _SP1_NOP

[gcode_button k1_nc]
#  M5-STOP PF0 <- K1 NC auxiliary contact to GND (PRESSED = relay released, contacts not welded)
pin: ^!PF0
press_gcode: _SP1_NOP
release_gcode: _SP1_NOP

[gcode_button moved]
#  M6-STOP PC15 <- MOVED button (to GND)
pin: ^!PC15
press_gcode: _SP1_NOP
release_gcode: _SP1_NOP

[gcode_button latch_q]
#  Probe header PD13 <- opto on latch Q (PRESSED = REFLEX latch tripped)
pin: ^!PD13
press_gcode: _SP1_NOP
release_gcode: _SP1_NOP

[gcode_button lever]
#  Probe header PD12 <- opto on the node after the hold-to-run lever
pin: ^!PD12
press_gcode: _SP1_NOP
release_gcode: _SP1_NOP

[gcode_button estop_ok]
#  PS-ON header PD14 <- opto on the node after e-stop pole 1
pin: ^!PD14
press_gcode: _SP1_NOP
release_gcode: _SP1_NOP

[gcode_button loop_ok]
#  SPI header PC11 <- opto on the node after the helmet loop
pin: ^!PC11
press_gcode: _SP1_NOP
release_gcode: _SP1_NOP

#  MODE selector: 1P4T rotary + resistor ladder on TB (PB1, on-board 4.7 k pull-up):
#  PLINE 1 k, LINE 3.3 k, CIRCLE 10 k, MIX 33 k to GND.  Cable unplugged = open = no mode.
[gcode_button mode_pline]
pin: PB1
analog_range: 500, 1800
analog_pullup_resistor: 4700
press_gcode: _SP1_NOP

[gcode_button mode_line]
pin: PB1
analog_range: 2200, 5000
analog_pullup_resistor: 4700
press_gcode: _SP1_NOP

[gcode_button mode_circle]
pin: PB1
analog_range: 6800, 15000
analog_pullup_resistor: 4700
press_gcode: _SP1_NOP

[gcode_button mode_mix]
pin: PB1
analog_range: 22000, 50000
analog_pullup_resistor: 4700
press_gcode: _SP1_NOP

# -------------------------------------------------------------------------------------
#  HOST WATCHDOG.  scorer.py sends SP1_HEARTBEAT every 0.25 s.  If it stops for 1 s
#  (scorer hung or killed) Klipper runs M112: immediate MCU shutdown -> every output
#  to its shutdown value -> watchdog PWM stops -> rail opens.  (klippy itself dying is
#  covered by maximum_mcu_duration above; the MCU dying by IWDG + the charge pump.)
# -------------------------------------------------------------------------------------
[gcode_macro SP1_HEARTBEAT]
gcode:
  UPDATE_DELAYED_GCODE ID=_sp1_host_wd DURATION=1.0

[delayed_gcode _sp1_host_wd]
gcode:
  M112

[gcode_macro SP1_ALL_OFF]
description: every output off (vent pins, retract pad, open dumps, pumps off)
gcode:
  SET_PIN PIN=pin_a VALUE=0
  SET_PIN PIN=pin_b VALUE=0
  SET_PIN PIN=palm VALUE=0
  SET_PIN PIN=rail_dump VALUE=0
  SET_PIN PIN=palm_dump VALUE=0
  SET_HEATER_TEMPERATURE HEATER=rail TARGET=0
  SET_HEATER_TEMPERATURE HEATER=palm TARGET=0

[gcode_macro SP1_HOME_DRUMS]
description: console homing of all three drums (scorer does the same at ARMING). Lever held!
gcode:
  {% set idx = params.INDEX|default(0.0)|float %}
  {% for s in ["cable_a", "cable_b", "cable_c"] %}
    MANUAL_STEPPER STEPPER={s} GCODE_AXIS=
    MANUAL_STEPPER STEPPER={s} ENABLE=1
    MANUAL_STEPPER STEPPER={s} SET_POSITION={idx + 12.0}
    MANUAL_STEPPER STEPPER={s} SPEED=5 MOVE={idx} STOP_ON_ENDSTOP=home
    MANUAL_STEPPER STEPPER={s} SPEED=5 MOVE=0
  {% endfor %}
  MANUAL_STEPPER STEPPER=cable_a GCODE_AXIS=A LIMIT_VELOCITY=250 LIMIT_ACCEL=100000000
  MANUAL_STEPPER STEPPER=cable_b GCODE_AXIS=B LIMIT_VELOCITY=250 LIMIT_ACCEL=100000000
  MANUAL_STEPPER STEPPER=cable_c GCODE_AXIS=C LIMIT_VELOCITY=250 LIMIT_ACCEL=100000000
  G90

#  The S0 / V-K1 streaming test is host-side: python3 -m sp1v3.benchtest (electronics.md §9.4).
