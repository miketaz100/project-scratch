# printer.cfg - S0b Klipper streaming test + tendon ink rig (PROJECT SCRATCH, 14-build/S0/klipper)
# Board: BTT Manta M8P V2.0 + CB1 (the Stage A controller; this file grows into the Stage A config).
# SYSTEM-SPEC-v3 sec 8.2: no kinematics, three manual steppers driven as extra G-code axes A, B, C.
#
# BEFORE YOU USE IT: every pin marked <...> must be copied from BTT's sample config for the
# Manta M8P V2.0 (github.com/bigtreetech/Manta-M8P -> V2.0 -> Firmware -> Klipper; file name
# starts "generic-bigtreetech-manta-m8p-V2"). Use MOTOR1, MOTOR2, MOTOR3 for cables A, B, C and
# a free 3.3 V GPIO for the stand-in valve LED. [VERIFY pin names on the BTT file; do not guess]
#
# Drivers for S0b: BTT TMC2209 V1.3 in UART mode (one UART jumper per socket, per the M8P V2.0
# manual), so the current is set here (0.35 A, spec 4.4) without a multimeter.  Stage A switches to
# STANDALONE + VREF as spec C20 requires (hardware current cap; needs a multimeter) - see S0-guide K2.
# FAN0 is NOT used for the LED: it switches 24 V, which would destroy the 5 V logic analyser.  Put the
# LED on a free 3.3 V GPIO of the expansion/probe header instead (S0-guide K8). [VERIFY pins]

[mcu]
serial: /dev/serial/by-id/<paste the usb-Klipper_stm32h723xx_... id from `ls /dev/serial/by-id/`>

[printer]
kinematics: none
max_velocity: 300
max_accel: 3000

[manual_stepper cable_a]
step_pin: <MOTOR1 STEP pin>
dir_pin: <MOTOR1 DIR pin>
enable_pin: !<MOTOR1 EN pin>
microsteps: 16
rotation_distance: 37.699     # pi x 12 mm drum pitch diameter: axis units = mm of cable
velocity: 50
accel: 2000

[manual_stepper cable_b]
step_pin: <MOTOR2 STEP pin>
dir_pin: <MOTOR2 DIR pin>
enable_pin: !<MOTOR2 EN pin>
microsteps: 16
rotation_distance: 37.699
velocity: 50
accel: 2000

[tmc2209 manual_stepper cable_a]
uart_pin: <MOTOR1 UART pin>
run_current: 0.35
stealthchop_threshold: 999999

[tmc2209 manual_stepper cable_b]
uart_pin: <MOTOR2 UART pin>
run_current: 0.35
stealthchop_threshold: 999999

[tmc2209 manual_stepper cable_c]
uart_pin: <MOTOR3 UART pin>
run_current: 0.35
stealthchop_threshold: 999999

[manual_stepper cable_c]
step_pin: <MOTOR3 STEP pin>
dir_pin: <MOTOR3 DIR pin>
enable_pin: !<MOTOR3 EN pin>
microsteps: 16
rotation_distance: 37.699
velocity: 50
accel: 2000

# stand-in for a PIN valve: LED + 330 ohm resistor from a free 3.3 V GPIO to GND (logic analyser CH0 on the same pin)
[pwm_tool valve_led]
pin: <free 3.3 V GPIO on the M8P expansion or probe header>
value: 0
shutdown_value: 0
# (Stage A adds maximum_mcu_duration here as a secondary watchdog barrier, spec E1; not needed for S0b)

[virtual_sdcard]
path: ~/printer_data/gcodes

[pause_resume]

[display_status]

# Turn the three steppers into G-code axes A, B, C (spec 8.2 / V-K1).  Run once after every restart
# (the generated .gcode files also call it on their first line).
[gcode_macro AXES_ON]
gcode:
    MANUAL_STEPPER STEPPER=cable_a ENABLE=1
    MANUAL_STEPPER STEPPER=cable_b ENABLE=1
    MANUAL_STEPPER STEPPER=cable_c ENABLE=1
    MANUAL_STEPPER STEPPER=cable_a SET_POSITION=0 GCODE_AXIS=A
    MANUAL_STEPPER STEPPER=cable_b SET_POSITION=0 GCODE_AXIS=B
    MANUAL_STEPPER STEPPER=cable_c SET_POSITION=0 GCODE_AXIS=C
    G90

[gcode_macro AXES_OFF]
gcode:
    SET_PIN PIN=valve_led VALUE=0
    MANUAL_STEPPER STEPPER=cable_a ENABLE=0
    MANUAL_STEPPER STEPPER=cable_b ENABLE=0
    MANUAL_STEPPER STEPPER=cable_c ENABLE=0
